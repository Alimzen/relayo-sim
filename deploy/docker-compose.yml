# Production: docker compose --env-file .env up -d --build   (from deploy/)
services:
  sim:
    build: ..
    restart: unless-stopped
    depends_on: [postgres, redis, certs]
    environment:
      DATABASE_URL: postgres://relayo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/relayo_sim
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SIGNUP: ${SIGNUP:-open}
      TRUST_PROXY: "1"
      PUBLIC_URL: https://${SIM_DOMAIN}
      MONTHLY_MESSAGE_LIMIT: ${MONTHLY_MESSAGE_LIMIT:-1000}
      MESSAGES_PER_MINUTE: ${MESSAGES_PER_MINUTE:-120}
      LIVE_MONTHLY_MESSAGE_LIMIT: ${LIVE_MONTHLY_MESSAGE_LIMIT:-1000}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      MAIL_URL: ${MAIL_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TERMS_URL: ${TERMS_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      SECRETS_KEY: ${SECRETS_KEY:-}
      SECRETS_KEY_PREVIOUS: ${SECRETS_KEY_PREVIOUS:-}
      MANAGED_SMTP_URL: ${MANAGED_SMTP_URL:-}
      MANAGED_SPF_INCLUDE: ${MANAGED_SPF_INCLUDE:-}
      MANAGED_DAILY_LIMIT: ${MANAGED_DAILY_LIMIT:-200}
      MANAGED_EVENTS_TOKEN: ${MANAGED_EVENTS_TOKEN:-}
      MANAGED_APPROVAL: ${MANAGED_APPROVAL:-manual}
      MANAGED_SES_REGION: ${MANAGED_SES_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # STARTTLS with Caddy's certificate for SIM_DOMAIN (copied by "certs"); re-read twice a day after renewals.
      TLS_CERT_FILE: /certs/smtp.crt
      TLS_KEY_FILE: /certs/smtp.key
    ports:
      # SMTP. 587 and 2525 are the submission ports CI providers leave open; 25 is not needed.
      - "587:2525"
      - "2525:2525"
    volumes:
      - certs:/certs:ro
      # Your own website at / (index.html, other pages, assets under /site/): see site/README.md.
      # - ./site:/app/site:ro

  # Caddy keeps its keys readable by root only; the simulator runs as an unprivileged user. This copies the
  # certificate, when it changes, to a volume the simulator can read.
  certs:
    image: busybox:1.37
    restart: unless-stopped
    environment:
      SOURCE: /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${SIM_DOMAIN:?set SIM_DOMAIN}
      DOMAIN: ${SIM_DOMAIN}
    command:
      - sh
      - -c
      - |
        while true; do
          if [ -f "$$SOURCE/$$DOMAIN.key" ] && ! cmp -s "$$SOURCE/$$DOMAIN.crt" /certs/smtp.crt; then
            cp "$$SOURCE/$$DOMAIN.key" /certs/smtp.key && cp "$$SOURCE/$$DOMAIN.crt" /certs/smtp.crt
            chown 1000:1000 /certs/smtp.key /certs/smtp.crt && chmod 0400 /certs/smtp.key
            echo "certificate copied"
          fi
          sleep 300
        done
    volumes:
      - caddy_data:/caddy:ro
      - certs:/certs

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SIM_DOMAIN: ${SIM_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: relayo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: relayo_sim
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Daily database dump at 03:00 UTC into deploy/backups, keeping the last 14. Copy them off the server too.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          sleep $$(( (86400 + 3 * 3600 - $$(date -u +%s) % 86400) % 86400 + 1 ))
          file=/backups/relayo_sim-$$(date -u +%Y%m%d).sql.gz
          pg_dump -h postgres -U relayo relayo_sim | gzip > "$$file.tmp" && mv "$$file.tmp" "$$file" && echo "backup $$file"
          ls -1t /backups/*.sql.gz | tail -n +15 | xargs -r rm --
        done
    volumes:
      - ./backups:/backups

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  certs:
