# Local infrastructure for Relayo Sim: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: relayo
      POSTGRES_PASSWORD: relayo
      POSTGRES_DB: relayo_sim
    ports: ["5433:5432"] # 5433 so it doesn't clash with a local PostgreSQL
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
